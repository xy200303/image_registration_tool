[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-registration-tool"
version = "0.1.0"
description = "PyQt6-based infrared and visible image registration toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6==6.6.1",
    "PyQt6-Qt6==6.6.1",
    "opencv-python==4.9.0.80",
    "numpy==1.26.4",
    "scipy==1.11.4",
]

[project.scripts]
image-registration-tool = "image_registration_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
